# superorchestrator configuration.
#
# Every section is optional; the values below are the defaults, shown commented
# out. Change one with `superorchestrator config set <key> <value>` or edit this
# file with `superorchestrator config edit`.

# [limits]
# global_cap = 16
# max_children = 8

# [runs]
# stall_ms = 300000
# ask_timeout = "30m"

# [usage]
# probe_ttl = "5m"
# low_pct = 15
# default_cooldown = "5h"

# [router]
# priority = ["agy", "opencode", "codex", "claude"]
#
# [router.jev]
# model = "inception/mercury-decide:free"   # any OpenRouter id; env SUPERORCHESTRATOR_ROUTER_MODEL
# fallback_model = "~typesafe/jev-latest"   # tried when the model is unreachable; "none" disables
# on_unreachable = "error"                  # or "heuristic" to degrade when no decider answers
# key_file = "~/.config/jev/.env"           # dotenv with OPENROUTER_API_KEY

# Levels map the decider's 0-100 complexity score to models, listed as harness/model/effort
# with the most preferred first. Ranges are inclusive and must not overlap (gaps are fine);
# `tier` is used only when `models` is empty. Without any [[router.levels]] the defaults
# low/mid/high apply (0-37 fast, 38-62 mid, 63-100 high). `init` writes five levels at the
# end of a new file.
# [[router.levels]]
# name = "low"
# min = 0
# max = 37
# tier = "fast"
#
# [[router.levels]]
# name = "high"
# min = 63
# max = 100
# models = ["agy/gemini-3.8-flash-high/high", "agy/gemini-3.8-flash-medium/medium"]

# [worktrees]
# dir = "{repo_parent}/{repo}-worktrees"
# branch_prefix = "so/"

# [accounts]
# wrapper_dir = "~/.local/bin"

# [ui]
# bind = "127.0.0.1"
# port = 7878

# [supervisor]
# idle_exit = "10m"

# [notifications]
# desktop = true
