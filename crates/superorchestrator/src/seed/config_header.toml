# superorchestrator configuration.
#
# Every section is optional; the values below are the defaults, shown commented
# out. Change one with `superorchestrator config set <key> <value>` or edit this
# file with `superorchestrator config edit`.

# [limits]
# global_cap = 16
# max_children = 8

# [runs]
# stall_ms = 300000
# ask_timeout = "30m"

# [usage]
# probe_ttl = "5m"
# low_pct = 15
# default_cooldown = "5h"

# [router]
# priority = ["agy", "opencode", "codex", "claude"]
#
# [router.jev]
# model = "inception/mercury-decide:free"   # any OpenRouter id; env SUPERORCHESTRATOR_ROUTER_MODEL
# fallback_model = "~typesafe/jev-latest"   # tried when the model is unreachable; "none" disables
# on_unreachable = "error"                  # or "heuristic" to degrade when no decider answers
# key_file = "~/.config/jev/.env"           # dotenv with OPENROUTER_API_KEY

# Levels map the decider's 0-100 complexity score to choices. Ranges are inclusive and must
# not overlap (gaps are fine); a lower `priority` number is preferred, and `tier` is used only
# when `choices` is empty. Without any [[router.levels]] the defaults low/mid/high apply.
# [[router.levels]]
# name = "low"
# min = 0
# max = 39
# tier = "fast"
#
# [[router.levels]]
# name = "high"
# min = 80
# max = 100
# choices = [{ id = "codex-gpt-high", priority = 1 }, { id = "agy-pro-high" }]

# [worktrees]
# dir = "{repo_parent}/{repo}-worktrees"
# branch_prefix = "so/"

# [accounts]
# wrapper_dir = "~/.local/bin"

# [ui]
# bind = "127.0.0.1"
# port = 7878

# [supervisor]
# idle_exit = "10m"

# [notifications]
# desktop = true

# Choices are the routable set: each binds a harness, model and effort.
