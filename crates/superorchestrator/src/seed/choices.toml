[[choices]]
id = "agy-flash-medium"
harness = "agy"
model = "gemini-3.8-flash-medium"
effort = "medium"
roles = ["worker", "conductor"]
description = "Gemini 3.8 Flash in Antigravity, medium effort. Default worker for ordinary, well-scoped work confined to one area: some exploration or reading, modest reasoning, clear success criteria. Fast and cheap. Escalate for demanding logic, an unknown cause, or work that spans many components."
enabled = true

[[choices]]
id = "agy-flash-high"
harness = "agy"
model = "gemini-3.8-flash-high"
effort = "high"
roles = ["worker"]
description = "Gemini 3.8 Flash in Antigravity, high effort. Fast worker for hard but well-defined work in one area: demanding logic, many edge cases, longer sequences of dependent steps. Escalate when the approach or cause is unknown, or when a mistake would be costly or hard to undo."
enabled = true

[[choices]]
id = "agy-flash-low"
harness = "agy"
model = "gemini-3.8-flash-low"
effort = "low"
roles = ["worker"]
description = "Gemini 3.8 Flash in Antigravity, low effort. Cheapest and fastest worker. For mechanical, fully specified work that needs almost no reasoning or exploration: the change and its exact place are given or obvious. Escalate when the task has to explore, interpret or decide anything."
enabled = true

[[choices]]
id = "agy-sonnet-thinking"
harness = "agy"
model = "claude-sonnet-4-6"
# "thinking" is a router hint: the model is the thinking variant, so agy gets no --effort.
effort = "thinking"
roles = ["worker"]
description = "Claude Sonnet 4.6 with extended thinking in Antigravity. The most careful worker, and slower. For tasks where correctness depends on long chains of reasoning, where the approach or cause is not yet known, or where mistakes are costly or hard to reverse. Choose it when depth of reasoning matters more than breadth or speed."
enabled = true

[[choices]]
id = "opencode-muse-long"
harness = "opencode"
model = "opencode/muse-spark-1.3-contributor-free"
roles = ["conductor", "worker"]
description = "OpenCode worker on Muse Spark 1.3 free tier with a large context window. For work that is broad rather than deep: many components or files held in mind at once, comparing or structuring whole systems, long multi-step jobs, and managing other workers (planning, delegating, integrating results, final verification). Free capacity."
enabled = true

[[choices]]
id = "opencode-deepseek-small"
harness = "opencode"
model = "opencode/deepseek-v4.1-flash-free"
roles = ["worker"]
description = "OpenCode worker on DeepSeek V4.1 Flash free tier. Free fallback for small, routine tasks with clear instructions. Weaker than the Gemini workers at exploring unfamiliar code; no account lease needed."
enabled = true

[[choices]]
id = "agy-designer"
harness = "agy"
model = "gemini-3.8-flash-medium"
effort = "medium"
roles = ["worker", "designer"]
description = "Designer subagent with Stitch MCP and frontend design skills. Only for visual and UX design work: analyzes user requirements, generates design.md and Stitch screens, and builds a Next.js frontend upon user approval. Not for backend, search, debugging or general coding tasks."
enabled = true

[[choices]]
id = "codex-high"
harness = "codex"
model = "gpt-6.1-sol"
effort = "high"
roles = ["worker", "conductor"]
description = "Codex with high reasoning effort. Strong general worker for complex implementation and review. Not eligible until a codex account is signed in."
enabled = true

[[choices]]
id = "codex-medium"
harness = "codex"
model = "gpt-6.1-sol"
effort = "medium"
roles = ["worker"]
description = "Codex with medium reasoning effort. Balanced worker for routine implementation. Not eligible until a codex account is signed in."
enabled = true

[[choices]]
id = "claude-sonnet"
harness = "claude"
model = "claude-sonnet-5-5"
effort = "medium"
roles = ["worker", "conductor"]
description = "Claude Sonnet with medium effort. Capable worker for integration and judgment tasks. Off by default so auto routing keeps Claude limits for the orchestrator (SPEC 8.4); set enabled = true to allow it as the last resort."
enabled = false

[[choices]]
id = "claude-haiku"
harness = "claude"
model = "claude-haiku-5-5"
effort = "medium"
roles = ["worker"]
description = "Claude Haiku with medium effort. Fast worker for mechanical, fully specified tasks. Off by default so auto routing keeps Claude limits for the orchestrator (SPEC 8.4); set enabled = true to allow it as the last resort."
enabled = false
