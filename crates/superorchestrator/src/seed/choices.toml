[[choices]]
id = "agy-flash-medium"
harness = "agy"
model = "gemini-3.8-flash-medium"
effort = "medium"
roles = ["worker", "conductor"]
description = "Gemini 3.8 Flash in Antigravity with medium reasoning effort. The default worker for bounded, clearly scoped tasks that need some reading of the repository: finding where something is defined or configured, read-only lookups, summarizing given output, small scoped edits, docs, simple scripts, straightforward tests, routine UI slices. Choose it when requirements and verification are clear and the task is confined to one component. Not for system-wide analysis, root-cause investigation or design."
enabled = true

[[choices]]
id = "agy-flash-high"
harness = "agy"
model = "gemini-3.8-flash-high"
effort = "high"
roles = ["worker"]
description = "Gemini 3.8 Flash in Antigravity with high reasoning effort. Fast worker for a single well-defined but non-trivial piece of implementation: tricky logic, edge cases, algorithms, long single-component tasks, complex UI. Choose it for hard implementation inside one component, not for whole-system analysis, ambiguous diagnosis or security review."
enabled = true

[[choices]]
id = "agy-flash-low"
harness = "agy"
model = "gemini-3.8-flash-low"
effort = "low"
roles = ["worker"]
description = "Gemini 3.8 Flash in Antigravity with low reasoning effort. Cheapest worker, only for a trivial mechanical edit whose exact location and content are already known (a typo, a rename, one config or doc line, boilerplate). Needs no searching, reading of code or judgment. Not for anything that must find, read or reason about code."
enabled = true

[[choices]]
id = "agy-sonnet-thinking"
harness = "agy"
model = "claude-sonnet-4-6"
effort = "thinking"
roles = ["worker"]
description = "Claude Sonnet 4.6 with thinking in Antigravity. The deep-reasoning worker: root-cause investigation of ambiguous failures (rank hypotheses, narrow the cause), subtle bugs, race and concurrency diagnosis, security and trust-boundary review, backward-compatible migrations with rollback or preservation requirements. Choose it when the answer needs careful step-by-step reasoning over evidence, not breadth."
enabled = true

[[choices]]
id = "opencode-muse-long"
harness = "opencode"
model = "opencode/muse-spark-1.3-contributor-free"
roles = ["conductor", "worker"]
description = "OpenCode worker on Muse Spark 1.3 free tier with a long context window. Choose it for broad, whole-system work: analyzing a large or unfamiliar repository across many components, dependency maps, architecture and cross-system design comparisons, deciding how responsibilities are divided before implementation, and long multi-file implementation or TDD slices. Also the coordinator: decomposing work into slices, delegating to workers, checking integration and owning final verification."
enabled = true

[[choices]]
id = "opencode-deepseek-small"
harness = "opencode"
model = "opencode/deepseek-v4.1-flash-free"
roles = ["worker"]
description = "OpenCode worker on DeepSeek V4.1 Flash free tier. Small bounded tasks: routine edits, quick scripts, docs, simple tests, commit/push/PR with gh. Free tier: no account lease needed, used as automatic fallback. Lower capability than the Gemini workers for reading and searching a repository."
enabled = true

[[choices]]
id = "agy-designer"
harness = "agy"
model = "gemini-3.8-flash-medium"
effort = "medium"
roles = ["worker", "designer"]
description = "Designer subagent with Stitch MCP and frontend design skills. Only for visual and UX design work: analyzes user requirements, generates design.md and Stitch screens, and builds a Next.js frontend upon user approval. Not for backend, search, debugging or general coding tasks."
enabled = true

[[choices]]
id = "codex-high"
harness = "codex"
model = "gpt-6.1-sol"
effort = "high"
roles = ["worker", "conductor"]
description = "Codex with high reasoning effort. Strong general worker for complex implementation and review. Not eligible until a codex account is signed in."
enabled = true

[[choices]]
id = "codex-medium"
harness = "codex"
model = "gpt-6.1-sol"
effort = "medium"
roles = ["worker"]
description = "Codex with medium reasoning effort. Balanced worker for routine implementation. Not eligible until a codex account is signed in."
enabled = true

[[choices]]
id = "claude-sonnet"
harness = "claude"
model = "claude-sonnet-5-5"
effort = "medium"
roles = ["worker", "conductor"]
description = "Claude Sonnet with medium effort. Capable worker for integration and judgment tasks. Off by default so auto routing keeps Claude limits for the orchestrator (SPEC 8.4); set enabled = true to allow it as the last resort."
enabled = false

[[choices]]
id = "claude-haiku"
harness = "claude"
model = "claude-haiku-5-5"
effort = "medium"
roles = ["worker"]
description = "Claude Haiku with medium effort. Fast worker for mechanical, fully specified tasks. Off by default so auto routing keeps Claude limits for the orchestrator (SPEC 8.4); set enabled = true to allow it as the last resort."
enabled = false
