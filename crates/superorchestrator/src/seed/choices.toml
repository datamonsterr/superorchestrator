[[choices]]
id = "agy-flash-medium"
harness = "agy"
model = "gemini-3.8-flash-medium"
effort = "medium"
roles = ["worker", "conductor"]
description = "Gemini 3.8 Flash in Antigravity with medium reasoning effort. Fast worker for bounded implementation, simple scripts, documentation, straightforward tests, and routine UI/frontend slices. Prefer when requirements and verification steps are clear and routine."
enabled = true

[[choices]]
id = "agy-flash-high"
harness = "agy"
model = "gemini-3.8-flash-high"
effort = "high"
roles = ["worker"]
description = "Gemini 3.8 Flash in Antigravity with high reasoning effort. Stronger reasoning and deeper planning than medium, suited for long tasks, non-trivial logic, edge cases, algorithm implementation, and complex UI/frontend work while remaining fast."
enabled = true

[[choices]]
id = "agy-flash-low"
harness = "agy"
model = "gemini-3.8-flash-low"
effort = "low"
roles = ["worker"]
description = "Gemini 3.8 Flash in Antigravity with low reasoning effort. Fastest worker for trivial bounded tasks: tiny edits, boilerplate, simple scripts, straightforward docs. Prefer when the task is clearly scoped and cost matters most."
enabled = true

