
# Complexity levels: the decider scores each task 0-100, the level whose range holds the score
# lists the choices allowed for it (lower `priority` is preferred). Ranges are inclusive and
# match the decider's five anchors (0, 25, 50, 75, 100). Delete these to use the tier defaults.
[[router.levels]]
name = "trivial"
min = 0
max = 12
choices = [{ id = "agy-flash-low", priority = 1 }, { id = "agy-flash-medium", priority = 2 }]

