# Complexity levels: the decider scores each task 0-100 and the level whose range holds the
# score lists the models allowed for it as harness/model/effort, most preferred first.
# Ranges are inclusive and match the decider's five anchors (0, 25, 50, 75, 100).
# Add a Claude line such as "claude/claude-sonnet-5-5/medium" to let auto routing use Claude as
# the last resort (it ranks last unless named, SPEC 8.4). Delete these to use the tier defaults.
[[router.levels]]
name = "trivial"
min = 0
max = 12
models = ["agy/gemini-3.8-flash-low/low", "agy/gemini-3.8-flash-medium/medium"]

[[router.levels]]
name = "simple"
min = 13
max = 37
models = ["agy/gemini-3.8-flash-medium/medium", "opencode/opencode/deepseek-v4.1-flash-free"]

[[router.levels]]
name = "moderate"
min = 38
max = 62
models = ["agy/gemini-3.8-flash-high/high", "codex/gpt-6.1-sol/medium"]

[[router.levels]]
name = "complex"
min = 63
max = 87
models = ["agy/claude-sonnet-4-6/thinking", "opencode/opencode/muse-spark-1.3", "codex/gpt-6.1-sol/high"]

[[router.levels]]
name = "expert"
min = 88
max = 100
models = ["opencode/opencode/muse-spark-1.3", "codex/gpt-6.1-sol/high", "agy/claude-sonnet-4-6/thinking"]
