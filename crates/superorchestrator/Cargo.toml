[package]
name = "superorchestrator"
description = "Delegate coding work across harnesses and accounts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
so-core = { path = "../so-core" }
so-store = { path = "../so-store" }
so-harness = { path = "../so-harness" }
so-accounts = { path = "../so-accounts" }
so-usage = { path = "../so-usage" }
so-router = { path = "../so-router" }
so-agents = { path = "../so-agents" }
so-workflow = { path = "../so-workflow" }
so-supervisor = { path = "../so-supervisor" }
so-mcp = { path = "../so-mcp" }
so-web = { path = "../so-web" }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
chrono.workspace = true
dialoguer.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml_edit = "0.25"
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }

[[bin]]
name = "superorchestrator"
path = "src/main.rs"
