name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: actionlint,shellcheck
      - name: actionlint
        run: actionlint
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh

  scripts:
    name: installer test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: install.sh against a fake local release
        run: sh scripts/test-install.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  rust-arch:
    name: test (arch)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm base-devel rust git
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arch-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: arch-cargo-
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web lint
      - run: pnpm -C web typecheck
      - run: pnpm -C web test
      - run: pnpm -C web build
      - run: pnpm -C web size
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Informational: a coverage failure never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: e2e smoke
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The release binary embeds web/dist, so the smoke test checks the real UI is served.
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - run: cargo build --release --locked -p superorchestrator
      # Fake harnesses only: no real harness CLI is installed or run here.
      - run: scripts/smoke-ci.sh target/release/superorchestrator
