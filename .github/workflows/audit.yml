name: Audit

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    paths: ["Cargo.toml", "Cargo.lock", "**/Cargo.toml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "**/Cargo.toml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
